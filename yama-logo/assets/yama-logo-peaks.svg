<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="peakMain" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="peakLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="peakRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="1024" height="1024" rx="232" fill="#0A0F1E"/>

  <!-- Soft halo behind peaks -->
  <ellipse cx="512" cy="520" rx="420" ry="380" fill="url(#halo)"/>

  <!-- Left peak (distant, purple) -->
  <path d="M120 690 L340 380 L470 540 L360 690 Z" fill="url(#peakLeft)"/>

  <!-- Right peak (cyan) -->
  <path d="M600 690 L720 420 L904 690 Z" fill="url(#peakRight)"/>

  <!-- Central peak (tallest, main) -->
  <path d="M340 690 L512 240 L684 690 Z" fill="url(#peakMain)"/>

  <!-- Subtle snow-line on the central peak -->
  <path d="M486 322 L512 240 L538 322 L522 320 L512 304 L502 320 Z"
        fill="#E0F7FF" opacity="0.85"/>

  <!-- Horizontal ground with soft glow -->
  <rect x="120" y="690" width="784" height="14" rx="7" fill="url(#ground)"/>

  <!-- Wordmark -->
  <text x="512" y="836" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="130" font-weight="800" letter-spacing="18"
        fill="#F0F9FF">YAMA</text>
  <text x="512" y="902" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="38" font-weight="500" letter-spacing="28"
        fill="#7DD3FC">ENGINE</text>
</svg>
