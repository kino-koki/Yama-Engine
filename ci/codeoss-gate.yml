# Code - OSS 1.148.0 最轻量 web-only 干净 MIT 构建门禁（模板，未启用）
# 第二十轮实测：token 的 X-OAuth-Scopes 仅 `repo`，POST /git/trees 含
# .github/workflows/build.yml 会被 404 拒绝（去掉该路径即 201）。
# 故本文件仍需**在 GitHub 网页端移入 .github/workflows/** 才能启用，
# 本仓库不谎报已启用。与此同时，同一套 Python 校验语义已由
# YamaEngine.Tests/CodeOssMinimalTests.cs 与 CodeOssMinimalBridgeTests.cs
# 双实现进 xUnit，由现有 build.yml 的 Test step 每次真实执行。
# 与 Windows build job 解耦，不参与 -warnaserror / Test / Smoke 口径。
#
# 「最轻量」= 零 Node / 零 Electron / 零 npm 依赖的离线校验门禁。
# 本门禁**不编译** 1.8 GB 上游 workbench，也**不宣称**产物存在
# （compiledInThisRepo=false 写在 product.json / MINIMAL.lock.json）。
# 真正 web-only 编译是带 Node 24 的机器上的手动步骤：
#   python scripts/build_codeoss_minimal.py --plan
name: Code-OSS minimal clean MIT gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'ide/codeoss/**'
      - '.gitmodules'
      - 'scripts/fetch_codeoss.py'
      - 'scripts/build_codeoss_minimal.py'
      - 'ci/codeoss-gate.yml'

jobs:
  verify-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned tag / commit / clean product.json
        run: python scripts/fetch_codeoss.py --check
      - name: Verify minimal web-only build lock + config digests
        run: python scripts/build_codeoss_minimal.py --check
      - name: Verify YAMA-first language + project + script-binding declarations
        run: |
          python scripts/check_yama_project.py --check
          python scripts/check_yama_project.py --emit > yama-language-manifest.json
      - name: Emit minimal build manifest (no upstream compile)
        run: python scripts/build_codeoss_minimal.py --emit-manifest > minimal-build-manifest.json
      - name: Self-research boundary audit
        run: python scripts/audit_no_engine_copy.py .
      - name: Upload minimal build manifest
        uses: actions/upload-artifact@v4
        with:
          name: codeoss-minimal-1.148.0
          path: minimal-build-manifest.json
