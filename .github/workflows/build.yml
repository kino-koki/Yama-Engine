name: Build & Verify

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build + Test + Smoke (.NET 10 / Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目统一为 net10.0（global.json 锁定 SDK 10.0.203）。
      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # YamaEditor 是 WinUI 3 工程，依赖 Windows App SDK 1.8。
      # windows-2022 镜像通常已含相关目标；若 dotnet build 报缺少 WindowsAppSDK 的
      # MSBuild 目标，需在该 runner 上安装 VS 2022 的“使用 Windows App SDK 的 C# 开发”工作负载。
      - name: Restore
        run: dotnet restore YamaEditor.sln

      - name: Build (Debug | x64)
        run: dotnet build YamaEditor.sln -c Debug -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test YamaEngine.Tests/YamaEngine.Tests.csproj -c Debug --no-build

      # 无头引擎回归门禁：YamaCLI smoke 引导 EngineSystems 并 Tick 60 帧（不碰 GPU）。
      # smoke 失败时返回非 0，作为 CI 红灯条件；任何引擎引导/音频/物理子系统回归都会在此暴露。
      - name: Headless Engine Smoke (regression gate)
        run: dotnet run --project YamaCLI/YamaCLI.csproj -c Debug -- smoke 60

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/
