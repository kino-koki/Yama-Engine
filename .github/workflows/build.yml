name: Build & Verify

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build + Test (.NET 8 / Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0.422
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.422'

      # ShanyuEditor 是 WinUI 3 工程，依赖 Windows App SDK 1.8。
      # windows-2022 镜像通常已含相关目标；若 dotnet build 报缺少 WindowsAppSDK 的
      # MSBuild 目标，需在该 runner 上安装 VS 2022 的“使用 Windows App SDK 的 C# 开发”工作负载。
      - name: Restore
        run: dotnet restore ShanyuEditor.sln

      - name: Build (Debug | x64)
        run: dotnet build ShanyuEditor.sln -c Debug -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test ShanyuEngine.Tests/ShanyuEngine.Tests.csproj -c Debug --no-build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/

      # 注意：本工作流由"地基阶段"新增。首次在你自己的仓库运行时，
      # 真实编译错误清单会从 build 步骤输出，并随 artifacts 上传——这正是
      # 将"真实错误清单"固化为 CI 单一事实来源的关键一步（见 FOUNDATION_STATUS.md）。
