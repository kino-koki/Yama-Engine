name: Build & Verify

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build + Test + Smoke (.NET 10 / Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目统一为 net10.0（global.json 锁定 SDK 10.0.203）。
      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # YamaEditor 是 WinUI 3 工程，依赖 Windows App SDK 1.8；YamaEngineBridge 是 C++ 原生桥，
      # 需 VS MSBuild（dotnet CLI 无法导入 Microsoft.Cpp.Default.props，会报 MSB4278）。
      # 二者均有环境依赖（Windows App SDK / VS C++ 工作负载），不属于 dotnet CLI 可构建范围，
      # 故无头回归门禁仅构建托管引擎核心：YamaEngine + YamaEngine.Tests + YamaCLI。
      - name: Restore
        run: dotnet restore YamaEngine/YamaEngine.csproj && dotnet restore YamaEngine.Tests/YamaEngine.Tests.csproj && dotnet restore YamaCLI/YamaCLI.csproj

      # 0 警告门禁：-warnaserror 让任何未被 Directory.Build.props 显式抑制的警告
      # （包括新增代码引入的可空性 / 性能 / API 废弃问题）直接失败。
      - name: Build (Debug | x64 | -warnaserror)
        run: |
          dotnet build YamaEngine/YamaEngine.csproj -c Debug -p:Platform=x64 --no-restore -warnaserror
          dotnet build YamaEngine.Tests/YamaEngine.Tests.csproj -c Debug -p:Platform=x64 --no-restore -warnaserror
          dotnet build YamaCLI/YamaCLI.csproj -c Debug -p:Platform=x64 --no-restore -warnaserror

      # 测试套件已接入 xUnit（YamaEngine.Tests/XunitAdapter.cs 反射发现全部自研
      # public static void Test*() 方法并逐个以 [Theory] 执行，1559 用例）。
      # 以 dotnet test 作为回归门禁：任何用例失败即以非 0 退出码红灯。
      - name: Test (xUnit suite, regression gate)
        run: dotnet test YamaEngine.Tests/YamaEngine.Tests.csproj -c Debug -p:Platform=x64 --no-build --logger trx --results-directory TestResults

      # 无头引擎回归门禁：YamaCLI smoke 引导 EngineSystems 并 Tick 60 帧（不碰 GPU）。
      # smoke 失败时返回非 0，作为 CI 红灯条件；任何引擎引导/音频/物理子系统回归都会在此暴露。
      - name: Headless Engine Smoke (regression gate)
        run: dotnet run --project YamaCLI/YamaCLI.csproj -c Debug -- smoke 60

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
